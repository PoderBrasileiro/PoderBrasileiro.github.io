name: Atualizar dados e publicar

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 06:17 de Brasília
    # Noite de apuração: as urnas fecham às 17h de Brasília e o resultado sai
    # ao longo da noite. Sem isto o site só mostraria o presidente eleito na
    # manhã seguinte, que é tarde demais justamente no dia que mais importa.
    - cron: '20 20-23 25,26 10 *'   # 17h às 20h de Brasília, 25 e 26 de outubro
    - cron: '20 0-3 26,27 10 *'     # 21h às 0h de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falha de coleta não derruba a publicação: o site sai com os dados
      # que já estavam no repositório.
      - run: npm run coletar
        continue-on-error: true
      - run: npm run eleicao
        continue-on-error: true
      - run: npm run estaduais
        continue-on-error: true
      - run: npm run historico
        continue-on-error: true
      - run: npm run pecs
        continue-on-error: true
      - run: npm run noticias
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
      # Sem os quatro segredos cadastrados o script só ensaia, não posta.
      - run: npm run postar
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BSKY_USUARIO: ${{ secrets.BSKY_USUARIO }}
          BSKY_SENHA: ${{ secrets.BSKY_SENHA }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      # A pauta do dia, pra postar à mão onde não há API de graça.
      - run: npm run relatorio
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Guardar dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data data/postados.json relatorios PAUTA.md public/cartoes public/c public/pauta
          git diff --cached --quiet || git commit -m "chore: atualiza dados"
          git push
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
