name: Atualizar dados e publicar

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 06:17 de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falha de coleta não derruba a publicação: o site sai com os dados
      # que já estavam no repositório.
      - run: npm run coletar
        continue-on-error: true
      - run: npm run eleicao
        continue-on-error: true
      - run: npm run pecs
        continue-on-error: true
      - run: npm run noticias
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
      # Sem os quatro segredos cadastrados o script só ensaia, não posta.
      - run: npm run postar
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Guardar dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data data/postados.json
          git diff --cached --quiet || git commit -m "chore: atualiza dados"
          git push
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
