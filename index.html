<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Power Line — quem ocupa o poder, país por país</title>
  <meta name="description" content="Quem governa cada um dos 195 países e há quanto tempo, com a esquerda e a direita onde há dado. E o Brasil por dentro: presidente, ministros, STF, governadores, senadores, deputados e os prefeitos das 5.569 cidades.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Global Power Line">
  <meta property="og:title" content="Global Power Line — quem ocupa o poder, país por país">
  <meta property="og:description" content="195 países, quem governa e há quanto tempo. E o Brasil em profundidade, com dados públicos.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("tema");if(t==="claro"||t==="escuro")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <h1>Global Power Line</h1>
      <p>Quem ocupa o poder: 195 países, e o Brasil por dentro.</p>
    </div>
    <div class="busca">
      <label class="so-leitor" for="busca">Buscar político</label>
      <input id="busca" type="search" placeholder="Buscar por nome, partido ou pasta…" autocomplete="off">
      <ul id="busca-resultados" class="busca-resultados" hidden></ul>
    </div>
    <nav class="abas" role="tablist" aria-label="Visualizações">
      <button role="tab" data-aba="mundo" aria-selected="false">Mundo</button>
      <button role="tab" data-aba="mapa" aria-selected="true">Brasil</button>
      <button role="tab" data-aba="rede" aria-selected="false">Rede de poder</button>
      <button role="tab" data-aba="lista" aria-selected="false">Lista</button>
      <button role="tab" data-aba="pecs" aria-selected="false">PECs</button>
    </nav>
    <div class="tema" role="group" aria-label="Tema">
      <button data-tema="claro" title="Tema claro" aria-pressed="false">☀</button>
      <button data-tema="sistema" title="Seguir o sistema" aria-pressed="true">◐</button>
      <button data-tema="escuro" title="Tema escuro" aria-pressed="false">☾</button>
    </div>
  </header>

  <main class="palco">
    <section class="vis" aria-live="polite">
      <div id="vis-mundo" class="aba-conteudo" hidden></div>
      <div id="vis-mapa" class="aba-conteudo"></div>
      <div id="vis-rede" class="aba-conteudo" hidden></div>
      <div id="vis-lista" class="aba-conteudo" hidden></div>
      <div id="vis-pecs" class="aba-conteudo" hidden></div>
      <div id="legenda" class="legenda"></div>
    </section>
    <aside id="painel" class="painel" aria-label="Detalhes"></aside>
  </main>

  <footer class="rodape">
    <details>
      <summary>Fontes e metodologia</summary>
      <div id="metodologia"></div>
    </details>
    <div id="contagem"></div>
    <div id="presenca"></div>
    <p id="atualizado" class="fraco"></p>
  </footer>

  <div id="dica" class="dica" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
